<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Tres historias de una carta de amor fallida, publicadas capítulo a capítulo."
    />
    <meta name="theme-color" content="#261811" />
    <title>Tres historias de una carta de amor fallida</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="config.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#chapters">Saltar a las historias</a>

    <header class="hero" id="inicio">
      <div class="hero__image" aria-hidden="true"></div>
      <div class="hero__shade" aria-hidden="true"></div>

      <nav class="topbar" aria-label="Navegación principal">
        <a class="topbar__mark" href="#inicio" aria-label="Volver al inicio">TH</a>
        <p class="topbar__eyebrow">Una historia en tres tiempos</p>
        <a class="topbar__link" href="#chapters">Leer</a>
      </nav>

      <div class="hero__content">
        <p class="kicker" id="site-kicker"></p>
        <h1 id="site-title">Tres historias de una carta de amor fallida</h1>
        <p class="hero__intro" id="site-intro"></p>
      </div>

      <a class="scroll-cue" href="#chapters">
        <span>Desliza para descubrir</span>
        <span class="scroll-cue__line" aria-hidden="true"></span>
      </a>
    </header>

    <main id="chapters" aria-label="Historias"></main>

    <dialog class="reader" id="story-reader" aria-labelledby="reader-title">
      <div class="reader__header">
        <p id="reader-number"></p>
        <button class="reader__close" type="button" aria-label="Cerrar la historia">Cerrar ×</button>
      </div>
      <article class="reader__article">
        <h2 id="reader-title"></h2>
        <div class="reader__body" id="reader-body"></div>
      </article>
    </dialog>

    <footer class="footer">
      <p id="footer-title">Tres historias de una carta de amor fallida</p>
      <a href="#inicio">Volver al inicio ↑</a>
    </footer>

    <noscript>
      <p class="noscript">
        Activa JavaScript para ver las cuentas regresivas y acceder a las historias.
      </p>
    </noscript>
  </body>
</html>
